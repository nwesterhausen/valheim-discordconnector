name: Build and test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so a Valheim update that breaks the mod shows up even when nothing here changed.
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # The tests run inside a real Valheim dedicated server, which needs Windows here (tests/run-tests.ps1).
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      - name: Set up Valheim dedicated server
        id: valheim
        uses: ./.github/actions/setup-valheim

      - name: Build
        # -m:1: the Jotunn publicizer step races when projects build in parallel.
        run: dotnet build DiscordConnector.sln -c Release -m:1

      - name: Run tests
        shell: pwsh
        run: |
          .\tests\run-tests.ps1 -ServerPath "${{ steps.valheim.outputs.server-path }}" -Slow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests with embed messages
        shell: pwsh
        run: |
          .\tests\run-tests.ps1 -ServerPath "${{ steps.valheim.outputs.server-path }}" -Embeds -SkipBuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            tests/out/
            ${{ steps.valheim.outputs.server-path }}/BepInEx/LogOutput.log
          retention-days: 14

      - name: Upload Thunderstore packages
        uses: actions/upload-artifact@v7
        with:
          name: DiscordConnector-packages
          path: Packages/Thunderstore/*.zip
          retention-days: 30
